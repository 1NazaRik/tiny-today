<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <title>Сегодня — список дел</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #242620; background: #f7f4ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
    main { width: min(100%, 560px); }
    .eyebrow { color: #74796c; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .3rem 0 0; font-size: clamp(2.5rem, 9vw, 4rem); letter-spacing: -.06em; line-height: 1; }
    #date { margin: .8rem 0 2rem; color: #74796c; }
    form { display: flex; gap: .6rem; }
    input { min-width: 0; flex: 1; padding: .9rem 1rem; border: 1px solid #deded3; border-radius: 12px; background: white; font: inherit; }
    button { border: 0; border-radius: 12px; padding: .8rem 1rem; background: #344a36; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #263929; }
    ul { list-style: none; padding: 0; margin: 1.3rem 0; display: grid; gap: .55rem; }
    li { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; border: 1px solid #e6e4db; border-radius: 12px; background: #fffefa; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { color: #8b8d83; text-decoration: line-through; }
    .check { width: 1.2rem; height: 1.2rem; accent-color: #344a36; cursor: pointer; }
    .remove { padding: .2rem .45rem; background: transparent; color: #888b80; font-size: 1.2rem; }
    .remove:hover { background: #f1eee5; color: #242620; }
    footer { display: flex; justify-content: space-between; align-items: center; color: #74796c; font-size: .9rem; }
    footer button { padding: .35rem .55rem; background: transparent; color: #74796c; font-size: .85rem; }
    footer button:hover { background: #ebe8de; color: #242620; }
    :focus-visible { outline: 3px solid #a7b58e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Один день за раз</div>
    <h1>Сегодня</h1>
    <p id="date"></p>
    <form id="form">
      <input id="task" maxlength="160" placeholder="Что нужно сделать?" aria-label="Новая задача" required>
      <button type="submit">Добавить</button>
    </form>
    <ul id="list" aria-label="Список задач"></ul>
    <footer><span id="count"></span><button id="clear" type="button">Удалить выполненные</button></footer>
  </main>
  <script>
    const key = 'tiny-today-tasks';
    const form = document.querySelector('#form');
    const input = document.querySelector('#task');
    const list = document.querySelector('#list');
    const count = document.querySelector('#count');
    let tasks = JSON.parse(localStorage.getItem(key) || '[]');

    document.querySelector('#date').textContent = new Intl.DateTimeFormat('ru', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());

    function save() {
      localStorage.setItem(key, JSON.stringify(tasks));
      render();
    }

    function render() {
      list.replaceChildren();
      for (const task of tasks) {
        const row = document.createElement('li');
        row.classList.toggle('done', task.done);
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'check';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', `Отметить задачу «${task.text}» выполненной`);
        checkbox.addEventListener('change', () => { task.done = checkbox.checked; save(); });
        const label = document.createElement('span');
        label.textContent = task.text;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = '×';
        remove.setAttribute('aria-label', `Удалить задачу «${task.text}»`);
        remove.addEventListener('click', () => { tasks = tasks.filter(item => item !== task); save(); });
        row.append(checkbox, label, remove);
        list.append(row);
      }
      const remaining = tasks.filter(task => !task.done).length;
      count.textContent = remaining ? `Осталось: ${remaining}` : tasks.length ? 'Всё готово ✨' : 'Добавь первое дело';
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      save();
      input.focus();
    });
    document.querySelector('#clear').addEventListener('click', () => { tasks = tasks.filter(task => !task.done); save(); });
    render();
  </script>
</body>
</html>
